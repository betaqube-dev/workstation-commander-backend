spring:
  application:
    name: workstation-commander-backend
  datasource:
    url: jdbc:h2:mem:wcdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
security:
  jwt:
    secret: change-this-secret-in-prod-please-32bytes
    expiration: 3600000 # milliseconds
